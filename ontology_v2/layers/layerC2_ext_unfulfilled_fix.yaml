  - { to: L.ap.color_intensity, direction: increase, magnitude: medium, scoped_to_structure_class: any, source_type: prior, confidence: high }

- id: ING.yeast_extract_flavor_ext
  label: "Yeast extract (flavor extension)"
  alias_of: ING.yeast_extract
  overrides:
  - { to: L.ar.yeasty, direction: increase, magnitude: medium, scoped_to_structure_class: any, source_type: prior, confidence: high,
      note: "감칠맛은 FT.umami_source 태그가 이미 준다. 여기서는 효모 특유의 향만 보탠다." }

# ---------------------------------------------------------------- 저당 감미료의 부수 특성
# 2026-08-26 추가. L.ta.aftertaste_length 는 온톨로지 전체에 직접 엣지가 0건이었고,
# 소스에서만 R-1(지방 -> 여운)으로 간신히 닿았다. 나머지 4개 프로파일에서는
# 아예 움직이지 않는 축이었다.
#
# 고감미도 감미료의 여운은 이 제품군의 대표적 약점이고 저당 트랙의 핵심 트레이드
# 오프인데 기록이 없었다. HANDOFF 도 에리스리톨의 쿨링 오프노트를 경고한다.

- id: ING.high_intensity_sweetener_aftertaste_ext
  label: "High-intensity sweetener (aftertaste extension)"
  alias_of: ING.high_intensity_sweetener
  overrides:
  - { to: L.ta.aftertaste_length, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high,
      note: "스테비아/수크랄로스 계열의 정의적 약점. 벌크 감미료와 갈리는 지점이라 FT.sweetener 가 아니라 재료에 건다." }
  - { to: L.ta.bitter, direction: increase, magnitude: weak, scoped_to_structure_class: any, source_type: prior, confidence: medium,
      note: "특히 스테비올 배당체에서 고용량일 때. 확신도 medium — 감미료 종류마다 편차가 크다." }

- id: ING.erythritol_cooling_ext
  label: "Erythritol (cooling extension)"
  alias_of: ING.erythritol
  overrides:
  - { to: L.ch.minty_cool, direction: increase, magnitude: medium, scoped_to_structure_class: any, source_type: prior, confidence: high,
      note: "용해열이 크게 음(-)이라 입 안에서 냉각감을 준다. HANDOFF 가 '쿨링 오프노트 주의'로 적어 둔 것. 알룰로스가 저당 linchpin 인 이유가 바로 이 쿨링이 없다는 점이다." }

