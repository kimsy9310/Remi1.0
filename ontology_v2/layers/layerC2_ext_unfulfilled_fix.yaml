  - { to: L.ar.cumin, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }
  - { to: L.ar.earthy, direction: increase, magnitude: medium, scoped_to_structure_class: any, source_type: prior, confidence: medium }

- id: ING.garlic_powder_flavor_ext
  label: "Garlic powder (flavor extension)"
  alias_of: ING.garlic_powder
  overrides:
  - { to: L.ar.garlic, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }
