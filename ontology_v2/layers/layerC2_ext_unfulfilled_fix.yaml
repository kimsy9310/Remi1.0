  overrides:
  - { to: L.ap.color_intensity, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }
  - { to: L.ar.dried_red_chili, direction: increase, magnitude: weak, scoped_to_structure_class: any, source_type: prior, confidence: medium }

- id: ING.perilla_oil_flavor_ext
  label: "Perilla oil (flavor extension)"
  alias_of: ING.perilla_oil
  overrides:
  - { to: L.ar.perilla_oil, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }
  - { to: L.ar.roasted_sesame, direction: increase, magnitude: weak, scoped_to_structure_class: any, source_type: prior, confidence: medium }

- id: ING.rice_extract_flavor_ext
