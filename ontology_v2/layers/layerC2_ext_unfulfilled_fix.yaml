  - { to: L.ar.herbal, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high,
      note: "오레가노 케첩이 불변식 6 으로 걸린 지점. 이 엣지가 없어 오레가노는 입자 효과(grittiness/sediment)만 주고 향은 하나도 내지 못했다." }

