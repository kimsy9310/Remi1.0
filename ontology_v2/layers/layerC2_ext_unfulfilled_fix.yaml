  - { to: L.ch.pungent_hot, direction: increase, magnitude: weak, scoped_to_structure_class: any, source_type: prior, confidence: medium,
      note: "진저롤 계열 — 캡사이신과 기작이 다르지만 매운 감각축을 공유한다." }

- id: ING.ginger_powder_flavor_ext
  label: "Ginger powder (flavor extension)"
  alias_of: ING.ginger_powder
  overrides:
  - { to: L.ar.ginger_aroma, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }
  - { to: L.ch.nasal_pungent, direction: increase, magnitude: weak, scoped_to_structure_class: any, source_type: prior, confidence: medium }

- id: ING.gochugaru_fine_flavor_ext
  label: "Gochugaru fine (flavor extension)"
  alias_of: ING.gochugaru_fine
  overrides:
  - { to: L.ar.dried_red_chili, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }
  - { to: L.ap.color_intensity, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }

- id: ING.onion_powder_flavor_ext
  label: "Onion powder (flavor extension)"
  alias_of: ING.onion_powder
  overrides:
  - { to: L.ar.onion, direction: increase, magnitude: strong, scoped_to_structure_class: any, source_type: prior, confidence: high }
  - { to: L.ar.cooked_allium_sweet, direction: increase, magnitude: medium, scoped_to_structure_class: any, source_type: prior, confidence: medium }

- id: ING.oregano_mexican_flavor_ext
  label: "Mexican oregano (flavor extension)"
  alias_of: ING.oregano_mexican
