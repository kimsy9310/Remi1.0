meta:
  layer: M
  version: '2.0'
  date: '2026-08-25'
  profile: Oil-in-water emulsion beverage
  product: rice milk / plant beverage (product-level activation)
  product_ko: '쌀 음료 / 식물성 음료'
  spec: remi_ontology_spec_v2.md §2.3, §5.7
  note: >-
    PRODUCT-LEVEL ACTIVATION FILE, same pattern as layerM_cards_beverage_coffee_milk.yaml
    (migration finding F7). The profile base card set (layerM_cards_beverage.yaml) activates
    sweet / sour / body / cloudy, which is the generic O/W beverage read. The rice-milk track
    was actually evaluated on a different six axes, documented in HANDOFF_remi_project.md §3.1
    and used verbatim as the column headers of RM_warmloop_260720_fixed.xlsx. Without this
    file the recorded panel data cannot enter the model at all - only 2 of its 6 axes exist
    in the base profile.
  status: DRAFT - authored 2026-08-25 from existing panel data, needs domain review
  review_items:
    - >-
      L.tx.oiliness is the mapping chosen for the panel axis "oil flavor". LEXICON has no
      generic vegetable-oil AROMA term (nearest neighbours: L.ta.oleogustus - fatty-acid
      taste, too technical; L.ar.rancid_oxidized - already used by the separate oxidation
      axis). Oiliness is a texture percept, and the panel axis is named "flavor". For an
      untrained benchmark-relative score the two are hard to separate, so this is defensible,
      but confirm before treating the coefficient as an aroma effect. The alternative is to
      append a new L.ar term, which is a deliberate LEXICON change.
    - >-
      L.ar.rancid_oxidized is set evidence_required=sample, not sample_aged. The base profile
      quarantines it as sample_aged per spec §5.8, but the recorded panel scored it on FRESH
      samples. On fresh product the score mostly reads raw-material and oil-type quality
      rather than developed oxidation, which is still a genuine composition response. Do not
      mix these scores with aged-storage rancidity readings in one response vector.
    - >-
      All six are tier=core, which sits at the top of the 5-20 experiment guidance in §5.7.
      With n=20 recorded samples this is acceptable; if a later batch is smaller, demote
      rice flavour and oxidation to monitored first.
  counts:
    cards: 11
    core: 5
    monitored: 6
    sample_aged: 1

measurement_cards:
- term_id: L.tx.thickness
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 덜 걸쭉하다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 더 걸쭉하다'
    jar_target: '기준과 같게'
    evaluation_note: '바디감과 헷갈리기 쉽습니다. 바디감은 묽은 음료에도 쓰는 말이고, 걸쭉함은 풀바디를 넘어선 구간입니다. 스푼으로 떠서 흐르는 모양을 보면 갈라집니다.'
  active_in:
  - SC.emulsion.ow|APP.beverage
  tier: monitored
  method: JAR
  scale_type: jar_5
  benchmark: current_recipe
  default_goal: maintain
  reliability: medium
  evidence_required: sample
  jar_target: match benchmark
  note: >-
    Monitored by default, not core. Most beverages are asked about BODY; a thick
    beverage (yogurt smoothie, drinkable yogurt) is asked about THICKNESS instead.
    Which one is core is a PRODUCT decision - a product-level file (F7) promotes
    this to core and demotes L.tx.body. Added 2026-09-07 together with PO.0061,
    which made the axis reachable in beverage scope for the first time.
    Never core together with L.tx.body (they are the same continuum: body below,
    thickness above) or with L.tx.pourability (IN.0003 inverse).

- term_id: L.ta.sweet
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 덜 달다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 더 달다'
    evaluation_note: '마시는 온도에서 평가하세요. 차가우면 단맛이 눌리므로(R-2 저온→단맛), 기준보다 차게 마신 시료는 배합 때문이 아닌 이유로 낮게 나옵니다.'
  active_in: ['SC.emulsion.ow|APP.beverage']
  tier: core
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: high
  evidence_required: sample
  anchors:
    '-3': markedly less sweet than the benchmark
    '0': indistinguishable from the benchmark
    '+3': markedly sweeter than the benchmark
  evaluation_note: >-
    Serve at drinking temperature. Cold suppresses sweetness (R-2 cold -> sweet), so a
    sample tasted colder than the benchmark scores low for a reason that is not composition.
  legacy_column: sens_sweet

- term_id: L.ar.cooked_rice
  ko:
    anchors:
      '-3': '밥 향이 기준보다 뚜렷하게 약하다'
      '0': '기준과 구분되지 않는다'
      '+3': '밥 향이 기준보다 뚜렷하게 강하다'
    evaluation_note: '이 제품의 정체성 축이지 결함 축이 아닙니다 — 높일수록 좋은 것이 아니라 맞춰야 할 목표입니다. 코 뒤로 올라오는 향이므로 삼킨 뒤에 판단하고, 잔 위의 냄새로 판단하지 마세요.'
    pitfalls:
    - '단맛이 올라가면 밥 향이 더 강하게 느껴집니다. 두 축은 따로 나눠서 평가하세요.'
  active_in: ['SC.emulsion.ow|APP.beverage']
  tier: core
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: target
  reliability: medium
  evidence_required: sample
  anchors:
    '-3': rice character much weaker than the benchmark
    '0': indistinguishable from the benchmark
    '+3': rice character much stronger than the benchmark
  evaluation_note: >-
    This is the product's identity axis, not a defect axis - a target, not a maximise.
    Retronasal; assess after swallowing, not from the headspace.
  pitfalls:
    - Sweetness raises perceived rice character; score the two in separate passes.
  legacy_column: sens_rice flavor

- term_id: L.tx.oiliness
  ko:
    anchors:
      '-3': '기름진 느낌이 기준보다 뚜렷하게 적다'
      '0': '기준과 구분되지 않는다'
      '+3': '기름진 느낌이 기준보다 뚜렷하게 많다'
    evaluation_note: '산패취(L.ar.rancid_oxidized)와 분리해 둔 ''신선한 기름'' 쪽 읽기입니다. 이 축의 정의대로 향이 아니라 입천장에 남는 코팅을 기준으로 매기세요.'
    pitfalls:
    - '유화가 깨지면 자유 기름 때문에 기름짐이 높게 나옵니다 — 넣은 양 때문이 아니라 물리적인 이유입니다. 크리밍·분리를 함께 기록해 둬야 둘을 구분할 수 있습니다.'
  active_in: ['SC.emulsion.ow|APP.beverage']
  # [검토 2026-08-31 · 보류] core -> monitored.
  # 패널의 "oil flavor" 컬럼이 고소함(L.ar.nutty)을 잰 것인지 기름짐(식감)을
  # 잰 것인지 기록이 없다. 무엇을 잰 축인지 모르는 채로 목적함수에 넣으면
  # 모형이 엉뚱한 방향으로 최적화한다. 점수는 계속 기록하되 목표에서 뺀다.
  # 다음 패널이 세 축(고소함 / 쩐내 / 기름짐)을 따로 재면 되살린다.
  # 자세한 내용: ontology_v2/기름_관능용어_정리.md
  tier: monitored
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: decrease
  reliability: medium
  evidence_required: sample
  mapping_status: draft_confirm
  anchors:
    '-3': much less oily than the benchmark
    '0': indistinguishable from the benchmark
    '+3': much oilier than the benchmark
  evaluation_note: >-
    The fresh-oil read, kept separate from L.ar.rancid_oxidized. Score the coating left on
    the palate rather than the aroma, since that is what this L term defines.
  pitfalls:
    - >-
      A broken emulsion reads as high oiliness for a physical reason (free oil), not a
      dose reason. Record creaming/separation alongside so the two can be told apart.
  legacy_column: sens_oil flavor

- term_id: L.ar.rancid_oxidized
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 깨끗하다'
      '0': '기준과 구분되지 않는다'
      '+3': '쩐내·종이·절은 기름 냄새가 기준보다 뚜렷하다'
    evaluation_note: '갓 만든 시료에서 매기는 점수입니다. 훈련되지 않은 평가자는 산패취를 늦게, 들쭉날쭉하게 감지하므로 작은 차이는 잡음으로 보세요. 이 축으로 결정을 내릴 때는 어느 시료인지 모르게 하고 두 번 이상 맡아 보셔야 합니다.'
    pitfalls:
    - '해바라기유는 산화가 잘 됩니다. 기름 종류를 바꾸면 이 축이 넣은 양과 뒤섞입니다.'
  active_in: ['SC.emulsion.ow|APP.beverage']
  tier: core
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: decrease
  reliability: low
  evidence_required: sample
  anchors:
    '-3': markedly cleaner than the benchmark
    '0': indistinguishable from the benchmark
    '+3': clearly rancid / cardboard / painty against the benchmark
  evaluation_note: >-
    Scored on FRESH samples in this track - see review_items. Reliability is low because
    untrained panels detect oxidation late and inconsistently; treat a small difference as
    noise. Blind duplicates are required if this axis drives a decision (§5.4).
  pitfalls:
    - Sunflower oil is oxidation-prone; an oil-type change confounds this axis with dose.
  legacy_column: sens_oxidated oil

- term_id: L.tx.body
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 묽고 물 같다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 묵직하고 꽉 찬다'
    evaluation_note: '입에 넣었을 때의 묵직함과 꽉 찬 느낌을 봅니다. 크리미함(매끄럽고 지방 같은 질감)과 헷갈리기 쉬우니 바디감을 먼저 판단하세요.'
  active_in: ['SC.emulsion.ow|APP.beverage']
  tier: core
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: increase
  reliability: medium
  evidence_required: sample
  anchors:
    '-3': much thinner / more watery than the benchmark
    '0': indistinguishable from the benchmark
    '+3': much fuller-bodied than the benchmark
  evaluation_note: >-
    The panel column is "mouthfeel"; LEXICON folds SA.body_mouthfeel into L.tx.body
    (see _deprecated_aliases.yaml), so this is a direct legacy mapping, not a judgement call.
  legacy_column: sens_mouthfeel

- term_id: L.tx.creaminess
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 덜 크리미하다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 더 크리미하다'
    evaluation_note: '바디감과 다릅니다 — 바디감은 묵직함이고 크리미함은 매끄럽고 지방 같은 질감입니다. 패널이 둘을 섞어 답하므로 바디감을 먼저, 크리미함을 나중에 묻는 순서를 지키세요.'
    pitfalls:
    - '검(gum)으로 만든 걸쭉함은 바디감으로는 읽히지만 크리미함으로는 읽히지 않습니다. 두 축이 같이 움직이면 패널이 한 질문에 두 번 답하고 있을 가능성이 큽니다.'
  active_in: ['SC.emulsion.ow|APP.beverage']
  tier: core
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: increase
  reliability: medium
  evidence_required: sample
  anchors:
    '-3': much less creamy than the benchmark
    '0': indistinguishable from the benchmark
    '+3': much creamier than the benchmark
  evaluation_note: >-
    Distinct from body: body is thickness, creaminess is the smooth fat-like quality.
    Panels conflate them, so ask body first and creaminess second, in that order.
  pitfalls:
    - >-
      Gum-built thickness reads as body but not as creaminess; if both move together the
      panel is probably answering one question twice.
  legacy_column: sens_creaminess

- term_id: L.tx.pourability
  ko:
    anchors:
      '-3': 기준보다 뚜렷하게 잘 따라지지 않는다
      '0': 기준과 구분되지 않는다
      '+3': 기준보다 뚜렷하게 잘 따라진다
    evaluation_note: 병을 기울여 처음 흘러나오기까지와, 나오는 줄기의 굵기를 보세요.
  active_in:
  - SC.emulsion.ow|APP.beverage
  tier: monitored
  method: difference_from_reference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: high
  evidence_required: sample
  note: >-
    Added 2026-09-07 with PO.0062. A beverage is poured before it is drunk, so
    this axis is more native here than in a sauce, yet only the sauce profile had
    it. Never core together with L.tx.thickness (IN.0003 inverse) - asking both is
    asking one question twice.

- term_id: L.tx.mouthcoating_persistence
  ko:
    anchors:
      '-3': 코팅감이 기준보다 뚜렷하게 빨리 사라진다
      '0': 기준과 구분되지 않는다
      '+3': 코팅감이 기준보다 뚜렷하게 오래 남는다
    jar_target: 기준과 같게
    evaluation_note: 삼킨 뒤 10초쯤 지나 입안에 남은 막을 봅니다. 시간 축이라 편차가 큽니다 - core 로 올린다면 반복 시료가 필요합니다.
  active_in:
  - SC.emulsion.ow|APP.beverage
  tier: monitored
  method: JAR
  scale_type: jar_5
  benchmark: current_recipe
  default_goal: maintain
  reliability: low
  evidence_required: sample
  note: >-
    Added 2026-09-07 with PO.0063 / PO.0064. Fat leaves a film on the palate
    whether it arrives in a sauce or a milk drink; the lingering coating of a
    creamer beverage is this axis. Defect watch for plant beverages that use
    high-melting fats.

- term_id: L.ap.separated
  ko:
    anchors:
      '-3': 기준보다 확실히 안정적이다 (분리 흔적 없음)
      '0': 기준과 구분되지 않는다
      '+3': 기준보다 층이 뚜렷하게 갈라졌다
    jar_target: 눈에 보이는 층 갈라짐이 없을 것
    evaluation_note: 따로 보관해 둔 병으로 하는 저장 후 합·부 판정입니다(스펙 5.8). 크리밍·웃물·자유 기름을 봅니다.
  active_in:
  - SC.emulsion.ow|APP.beverage
  tier: monitored
  method: JAR
  scale_type: jar_5
  benchmark: current_recipe
  default_goal: minimize
  reliability: high
  evidence_required: sample_aged
  jar_target: no visible phase split
  note: >-
    Added 2026-09-07 with PO.0065. Visible phase split is the most common storage
    failure of an emulsion beverage, and the beverage profile carried the oil-ring
    card without the separation card behind it. Only the creaming leg is wired -
    P.coalescence_rate has no ingredient actuator in beverage scope yet.

- term_id: L.ap.milky_whiteness
  ko:
    anchors:
      '-3': 흰빛이 기준보다 뚜렷하게 약하다
      '0': 기준과 구분되지 않는다
      '+3': 기준보다 뚜렷하게 뽀얗게 희다
    evaluation_note: 탁함과 다른 축입니다. 탁함은 뿌연 정도, 백탁은 희기입니다 - 간장처럼 탁하지만 희지 않은 것도, 쌀음료처럼 둘 다 높은 것도 있습니다.
  active_in:
  - SC.emulsion.ow|APP.beverage
  tier: monitored
  method: difference_from_reference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: high
  evidence_required: sample
  note: >-
    Added 2026-09-07 with PO.0067 and the beverage-scope droplet edge
    (FT.emulsifier_droplet_beverage_scope). Finer droplets scatter light more and
    read whiter - the reason homogenisation whitens a milk drink. Promotable to
    core for plant beverages, where whiteness is what the drink is judged on
    before it is tasted.
