    - FT.umami_source
    role: secondary
    note: Routinely confused with total salt. In a 40% oil sauce the water-phase salt is nearly double the label
      figure, and it is the water-phase figure that preserves.
  - id: P.capsaicinoid_shu
    question_origin: defining
    plausible_range: 0 - 50,000 SHU
    range_basis: Table sauces span roughly 500-30,000 SHU; above that the category is a specialty extract product.
    range_source: literature
    range_confidence: medium
    governing_mechanism: Capsaicinoid concentration drives TRPV1 activation. Perceived heat is sublinear in concentration
      and is blunted by fat and by sugar.
    driven_by:
    - FT.pungent_principle
    - P.oil_phase_fraction
    role: primary
    cross_links:
