# =============================================================================
# LAYER M — 보편 축 (universal axes)
# -----------------------------------------------------------------------------
# 왜 이 파일이 있나
# -----------------
# 기본맛은 제형이 함의하지 않는다. 소금이 짜다는 것은 그것이 에멀전이든
# 현탁액이든 언 것이든 같다 — INGREDIENT 도 그렇게 적고 있다:
#
#     ING.salt -> L.ta.salty   scoped_to_structure_class: any
#
# 그런데 M 카드는 제형 파일마다 손으로 쓰였고, 그 결과 아이스크림에는 짠맛
# 카드가 없다. 소금은 아이스크림 팔레트에 있고 엔진은 소금이 짜다는 것을
# 알지만, 카드가 없어서 **묻지도 목표로 받지도 못한다.** 소금 캐러멜을
# 만들려는 사람이 "덜 짜게" 라고 말할 자리가 없다.
#
# 이것은 세 가지를 하나로 뭉갠 결과였다:
#
#     이 감각이 존재하나        -> 렉시콘.   제형 무관
#     여기서 어떻게 재나        -> M 카드.   제형 의존 (앵커·평가주의·신뢰도)
#     여기서 최적화 대상인가    -> tier.     제형 의존 (스펙 5.7)
#
# 첫 줄의 답을 **카드 유무로** 하고 있었던 것이 결함이다.
#
# 어떻게 고치나 — INGREDIENT 와 같은 2-tier
# --------------------------------------
# INGREDIENT 헤더가 이미 이 패턴을 쓴다:
#
#     "generic effects live on FUNCTION TAGS ... specific ingredients add
#      OVERRIDES only where they deviate."
#
# 축에도 같은 것을 적용한다. 여기 있는 카드가 **모든 프로파일의 기본값**이고,
# 제형 파일의 카드가 있으면 그것이 이긴다. 즉 제형 파일은 "벗어날 때만" 쓴다.
#
#   - 기본 tier 는 monitored 다. 물어볼 수 있지만 목적함수에는 안 들어간다
#     (스펙 5.7). core 로 올리려면 제형 파일에 카드를 쓴다 — 그것이 "이 제품
#     에서는 이 축이 결정적이다" 라는 선언이 된다.
#   - 앵커는 기준 대비 문장 하나뿐인 최소본만 둔다. 기본맛은 앵커까지도 맥락을
#     크게 타지 않는다 — "기준보다 뚜렷하게 덜 짜다" 는 어디서나 같은 뜻이다.
#     제형 파일에 카드가 있으면 그 앵커가 이긴다. 맥락을 타는 평가주의(온도·
#     시간·헷갈리는 이웃 축)는 제형 카드가 쓴다.
#     2026-09-07: 처음에는 앵커를 여기 두지 않았는데, 그러면 제품이 짠맛을
#     core 로 올리는 순간(소금 캐러멜 — 이 파일의 동기였던 그 예시) 화면의
#     설명줄이 빈다.
#
# 무엇을 여기 넣나
# ----------------
# 수용체 수준의 기본맛 다섯과 시간 축 하나. 어느 식품에나 있고, 제형이
# 그 존재를 좌우하지 않는다.
#
# 향(L.ar)·화학감각(L.ch)은 넣지 않는다. 그쪽은 제형이 아니라 **제품**이
# 정한다 — 2026-09-02 에 현탁액에서 발효 핫소스를 떼어내며 확인한 그 구분이다.
# 제품 사전(착수 순서 2번)이 정할 몫이라 순서상 뒤에 온다.
#
# 물성(L.tx)·외관(L.ap)도 넣지 않는다. 그쪽은 제형이 실제로 함의한다 —
# 언 것에만 얼음 씹힘이 있고, 에멀전에만 기름 고리가 있다.
#
# 이 파일은 PROFILES[*]['cards'] 에 들어가지 않는다. V2Ontology 가
# load_cards 를 감싸며 제형별 카드에 이 기본값을 채워 넣는다.
# active_in 은 그때 프로파일 스코프로 채워진다.
#
# 관련: docs/상호작용_알고리즘.md 4.6 절, ontology_v2/README_v2_적용.md
# =============================================================================

meta:
  layer: M
  version: '2.0'
  date: '2026-09-07'
  scope: universal
  applies_to: 모든 프로파일 (제형 파일의 같은 term_id 카드가 있으면 그쪽이 이긴다)
  spec: remi_ontology_spec_v2.md §2.3, §5.7
  note: >-
    Receptor-level basic tastes plus one temporal axis. A structure class implies
    rheology and appearance, not whether a food can taste salty. Default tier is
    monitored: askable and recordable, but out of the objective function until a
    profile card promotes it to core.

measurement_cards:

- term_id: L.ta.sweet
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 덜 달다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 더 달다'
  tier: monitored
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: high
  evidence_required: sample

- term_id: L.ta.salty
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 덜 짜다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 더 짜다'
  tier: monitored
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: high
  evidence_required: sample
  note: >-
    Absent from the ice cream, beverage and rice-milk profile files until
    2026-09-07, although ING.salt has carried a scope-any edge to this term all
    along. Salted caramel is not an exotic case; the axis simply had nowhere to
    be asked.

- term_id: L.ta.sour
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 덜 시다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 더 시다'
  tier: monitored
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: high
  evidence_required: sample

- term_id: L.ta.umami
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 감칠맛이 덜하다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 감칠맛이 더하다'
    evaluation_note: '짠맛과 함께 오르내리기 쉽습니다. 소금을 바꾼 시료라면 둘을 따로 보기 어렵습니다.'
  tier: monitored
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: medium
  evidence_required: sample

- term_id: L.ta.bitter
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 쓴맛이 덜하다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 쓴맛이 더하다'
    evaluation_note: '결함 축입니다. 다만 커피·카카오처럼 쓴맛이 제품의 성격인 경우에는 제형 카드가 이 기본값을 덮습니다.'
  tier: monitored
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: minimize
  reliability: medium
  evidence_required: sample
  note: >-
    Defect watch by default. Coffee milk promotes it to a positioning axis
    (default_goal target) in its own card; that is exactly the override this
    two-tier arrangement is for.

- term_id: L.ta.aftertaste_length
  ko:
    anchors:
      '-3': '기준보다 뚜렷하게 여운이 더 짧다'
      '0': '기준과 구분되지 않는다'
      '+3': '기준보다 뚜렷하게 여운이 더 길다'
    evaluation_note: '삼킨 뒤 15초쯤 지나 판정합니다. 여섯 축 중 편차가 가장 큽니다.'
  tier: monitored
  method: benchmark_difference
  scale_type: diff_7
  benchmark: current_recipe
  default_goal: maintain
  reliability: low
  evidence_required: sample
  note: >-
    Temporal attribute, highest variance of the six. Kept monitored everywhere;
    promoting it needs replicates.
