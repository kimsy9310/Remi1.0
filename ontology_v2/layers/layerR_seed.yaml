# --- appended 2026-08-25: rice-milk reachability (Invariant 6) ---------------
# The beverage profile had no path from any ingredient to creaminess or oiliness,
# so the recorded rice-milk panel data could not be fitted on those two axes.
# These supply the parameter -> percept half; the ingredient -> parameter half is
# layerC2_ext_beverage_fat_scope.yaml. Composition per spec §5.11.
# STATUS: DRAFT, source=prior. Confidence medium so 20 samples can overrule.
- id: PO.0059
  percept: L.tx.creaminess
  parameter: P.oil_phase_fraction
  functional_form: saturating
  monotone: increasing
  scope: SC.emulsion.ow|APP.beverage
  evidence:
    source: prior
    date: '2026-08-25'
  confidence: medium
  params: {}
  note: >-
    Dispersed oil droplets carry the fat-like smooth quality in a dilute O/W beverage.
    Saturating rather than linear: past roughly a few percent oil the beverage reads as
    oily rather than creamier, which is why oiliness is a separate axis with the opposite
    goal. Emulsion quality modulates this - the same oil fraction at a coarser droplet
    size reads less creamy and more oily - but droplet size has no actuator in this
    profile yet (spec §5.9), so the effect is attributed to oil fraction alone for now.
- id: PO.0060
  percept: L.tx.oiliness
  parameter: P.oil_phase_fraction
  functional_form: linear
  monotone: increasing
  scope: SC.emulsion.ow|APP.beverage
  evidence:
    source: prior
    date: '2026-08-25'
  confidence: medium
  params: {}
  note: >-
    Free and poorly emulsified oil coats the palate. Reads together with PO.0059:
    raising oil fraction buys creaminess and pays in oiliness, which is the actual
    trade-off the rice-milk DoE is exploring (HANDOFF §3.1, palm oil 15-45).
- id: PO.0061
  percept: L.tx.thickness
  parameter: P.apparent_viscosity
  functional_form: linear
  monotone: increasing
  scope: SC.emulsion.ow|APP.beverage
  evidence:
    source: prior
    date: '2026-09-07'
  confidence: medium
  note: >-
    Beverage counterpart of PO.0011. The C edge FT.thickener -> P.apparent_viscosity
    already carried scope SC.emulsion.ow.beverage, so an ingredient could raise
    viscosity in a beverage - but nothing carried that viscosity through to the
    thickness percept. The axis was unreachable and the app answered "no ingredient
    can move it", which was false. Added because a THICK BEVERAGE (yogurt smoothie,
    drinkable yogurt) must be formulable. Whether a product asks about thickness or
    about body is a PRODUCT decision, not a structure one.
- id: PO.0062
  percept: L.tx.pourability
  parameter: P.apparent_viscosity
  functional_form: linear
  monotone: decreasing
  scope: SC.emulsion.ow|APP.beverage
  evidence:
    source: prior
    date: '2026-09-07'
  confidence: medium
  note: >-
    Beverage counterpart of PO.0015. Pours easily is the inverse of thick
    (IN.0003), so opening thickness in beverage without pourability would leave
    the pair lopsided. A beverage is poured before it is drunk, which makes this
    axis more native here than in a sauce. Monitored, never core together with
    L.tx.thickness.
