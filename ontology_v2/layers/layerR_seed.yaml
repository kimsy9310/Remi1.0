relations_kinetics:
- id: KN.0001
  subject: P.sedimentation_rate
  functional_form: stokes
  params:
    proportional_to: d50^2 * density_difference / apparent_viscosity
  conditions:
    temperature: ambient
  caution: 'Do NOT temperature-accelerate sedimentation: lower viscosity at higher T sinks particles faster than
    reality (biased result). Rancidity may be accelerated; settling may not.'
  implication: No visible settling at 3 days predicts largely none at 28 days -> 3-day pass/fail check is sufficient
    (used by §5.8).
  evidence: *id001
  confidence: high
- id: KN.0002
  subject: L.ar.rancid_oxidized
  functional_form: first_order
  params:
    log_linear: true
    temperature_scaling: arrhenius
  conditions:
    accelerant: temperature, light, oxygen
  caution: 'Applies to unrefined aroma oils (sesame, perilla) first: the leading shelf-life failure of Ranita-type
    sauces.'
  implication: Accelerated (elevated-T) shelf testing is valid for oxidation, unlike sedimentation.
  evidence: *id001
  confidence: high
- id: KN.0003
  subject: L.ap.darkened
  functional_form: first_order
  params:
    note: capsanthin/chlorophyll degradation; green browns faster than red
  conditions:
    accelerant: light, heat, oxygen
  caution: Cannot be rescued by colourant without a label consequence (v1 note).
  evidence: *id001
  confidence: medium
