    ACROSS structure families - the audit only compared within a family, so this
    gap was invisible to it.
- id: PO.0069
  percept: L.ap.glossy
  parameter: P.soluble_solids_brix
  functional_form: saturating
  monotone: increasing
  scope: any
  evidence:
    source: prior
    date: '2026-09-10'
  confidence: medium
  note: >-
    Cause 2 of 3 in the user's gloss ruling (2026-09-10): gloss from sugars and
    water - starch syrup, oligosaccharide, honey, sugar, cooked down. A
    concentrated sugar solution dries to a continuous smooth film that reflects
    evenly; the cooking step is what raises the concentration, so Brix is the
    proxy the recipe side can actually move. Saturating, not linear: past the
    point where the film is continuous, more sugar adds no more gloss.
    Scope is any - a syrup film shines on a sauce, a glaze or a frozen surface
    alike.
- id: PO.0070
  percept: L.ap.glossy
  parameter: P.apparent_viscosity
  functional_form: saturating
  monotone: increasing
  scope: any
  evidence:
    source: prior
    date: '2026-09-10'
  confidence: medium
  note: >-
    Cause 3 of 3 in the user's gloss ruling (2026-09-10): gloss from additives -
    gelatin, starch and the like. These do not shine by themselves; they hold a
    continuous even surface film instead of letting it break up, and viscosity is
    the parameter both of them raise. Distinct from cause 2 (a sugar film is the
    solute drying) and cause 1 (free oil is a second phase).
    Note the tension to watch: the same parameter raises L.tx.thickness, so a
    product cannot chase gloss this way without getting thicker. If measurement
    ever separates the two, this record is the one to revisit.
- id: PO.0071
  percept: L.tx.creaminess
  parameter: P.solid_fat_content_37C
  functional_form: linear
  monotone: decreasing
  scope: any
  evidence:
    source: prior
    date: '2026-09-10'
  confidence: low
  note: >-
    SEEDED, DIRECTION NEEDS CONFIRMING. Fat still solid at mouth temperature reads
    waxy rather than creamy - the textbook reason a hydrogenated palm kernel fat
    is not used where clean melt matters. Truly non-monotone (too little solid fat
    is thin and watery), seeded linear-decreasing until measured. This is the one
    creaminess driver that fat TYPE carries and no other parameter held.
- id: PO.0072
  percept: L.tx.mouthcoating_persistence
  parameter: P.solid_fat_content_37C
  functional_form: linear
  monotone: increasing
  scope: any
  evidence:
    source: prior
    date: '2026-09-10'
  confidence: low
  note: >-
    SEEDED, DIRECTION NEEDS CONFIRMING. The other side of PO.0071 - fat that does
    not melt at mouth temperature stays as a film. Together the two records say
    what a formulator means by "this fat coats but is not creamy".
- id: PO.0073
  percept: L.tx.smoothness
  parameter: P.particle_size_d90
  functional_form: linear
  monotone: decreasing
  scope: any
  evidence:
    source: prior
    date: '2026-09-10'
  confidence: high
  note: >-
    THE PRIMARY LEG, and it has no actuator yet. User ruling 2026-09-10:
    smoothness is driven by viscosity and particle size, with PARTICLE SIZE THE
    MORE IMPORTANT of the two, and fat presence irrelevant. What breaks smoothness
    is a few coarse particles, not the median - so d90 (coarse tail), not d50.
    d50 would be reachable today because ingredients move it, but it answers a
    different question: d50 is what you put in, d90 is how far you ground it.
    Wiring d50 here would make the axis look healthy while measuring the wrong
    thing. So this record is written at its true parameter and waits: d90 has zero
    ingredient edges and is process-gated (see tools/audit_axis_scope.py section 6).
    PROCESS closes this. Until then the viscosity leg (PO.0074) carries the axis
    alone, which is why that one is marked partial.
- id: PO.0074
  percept: L.tx.smoothness
  parameter: P.apparent_viscosity
  functional_form: linear
  monotone: increasing
  scope: any
  evidence:
    source: prior
    date: '2026-09-10'
  confidence: low
  note: >-
    THE SECONDARY LEG, and on its own it is not enough. A more viscous continuous
    phase lubricates and masks small particles, so viscosity does raise smoothness -
    but with PO.0073 unreachable this record is the only path, and a model running
    on it alone cannot tell a coarsely ground sample from a finely ground one. That
    is the exact thing the user called more important. Written anyway because the
    axis must not stay frozen-only (user, 2026-09-10) - a plant beverage with
    gritty protein is a smoothness problem and the ontology could not say so.
    Treat any smoothness prediction as partial until PROCESS lands.
