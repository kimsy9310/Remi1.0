  spec: remi_ontology_spec_v2.md §2.1, §6.1
  note: Sole definition point for Layer L. Definitions are context-free, percept-only, one term per entry
    (Invariants 1,7; lexicon rules). The 'status' field is derived at load time, not authored here.
