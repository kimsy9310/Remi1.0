lexicon_terms:
- id: L.ap.color_intensity
  term: color intensity
  domain: ap
  subcategory: color
  definition: Overall depth of color from pale to deep/concentrated.
  ko: 색 진하기
  example_foods:
  - thin broth vs demi-glace
  source: Spectrum
  note: 'Scale poles: pale <-> deep'
- id: L.ap.color_vividness
  term: color vividness
  domain: ap
  subcategory: color
  definition: Saturation impression from dull to vivid.
  ko: 색 선명도
  example_foods:
  - fresh salsa vs faded paste
  source: Spectrum
  note: 'Scale poles: dull <-> vivid'
- id: L.ap.color_uniformity
  term: color uniformity
  domain: ap
  subcategory: color
  definition: Evenness of color across the product.
  ko: 색 균일성
  example_foods:
  - evenly colored sauce vs streaky
  source: Spectrum
- id: L.ap.browning_degree
  term: browning degree
  domain: ap
  subcategory: color
  definition: Position on the process-browning continuum (golden -> amber -> brown) signalling Maillard,
    caramelization or aging.
  ko: 갈변 정도
  example_foods:
  - fried crust
  - doenjang
  - black garlic
  source: Maillard literature
  note: Process-signal attribute; replaces hue names golden/amber/brown (v1.1)
- id: L.ap.glossy
  term: glossy
  domain: ap
  subcategory: gloss_surface
  definition: Surface reflects light evenly; shiny.
  ko: 윤기 나는
  example_foods:
  - teriyaki glaze
  source: Spectrum
  legacy_map:
  - SA.gloss
- id: L.ap.matte
  term: matte
  domain: ap
  subcategory: gloss_surface
  definition: Little surface reflection; no shine.
  ko: 무광
  example_foods:
  - fat-free dressing surface
  source: Spectrum
  merged_synonyms:
  - dull (surface)
- id: L.ap.oily_sheen
  term: oily sheen
  domain: ap
