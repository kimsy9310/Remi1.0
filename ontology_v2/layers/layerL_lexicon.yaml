  ko: 지방맛
  example_foods:
  - aged cheese edge cases
  source: Running 2015
  note: Textural fat feel -> Texture-surface
- id: L.ta.kokumi
  term: kokumi
  domain: ta
  subcategory: modulator
  definition: 'Modulating sensation with no own quality: amplifies thickness, continuity and mouthfulness
