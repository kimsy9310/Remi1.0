# =============================================================================
# PROJECT — RV rice milk
# -----------------------------------------------------------------------------
# 제품은 온톨로지에 등록하지 않는다. 여기 산다.
#
# 이 파일이 담는 것은 meta 뿐이다 (2026-09-11)
#   어제는 identity_axes · measurement_columns · learned 세 블록을 더 적었는데,
#   검증에서 셋 다 아무도 읽지 않는 것으로 드러났다. 정체성 축은 cards.yaml 의
#   default_goal: target 이, 실측 컬럼 매핑은 cards.yaml 의 legacy_column 이
#   이미 담고 있다 - **카드가 정본이고 여기 적으면 중복**이다. 실제로 둘이
#   어긋나 있었다(매니페스트는 정체성 2개, 카드에서 유도되는 것은 1개).
#   학습 기록은 환류가 생기면 그때 자리를 정한다.
#
# 왜 옮겼나
#   `beverage_rice_milk` 가 프로파일 등록부에 제형처럼 올라 있었다. 스펙 2.3 이
#   활성 맥락을 SC x APP x ST 로만 정의해 제품 차원이 없다는 것을 커피우유 파일
#   헤더가 이미 적고 있었다. 제형은 칸의 개수를 정하고 제품이 칸의 내용을
#   채우는 것이 원래 설계다(docs/상호작용_알고리즘.md 4.6).
#
# 형식은 잠정이다
#   Output 4·5·6 포맷이 정해지면 그 봉투를 따른다.
#
# 무엇이 여기 남고 무엇이 공유로 가나
#   좌표는 격리하고 기울기는 공유한다. 배합 %, 목표 점수, 샘플 ID, 벤치마크
#   제품명은 여기 남는다. "이 재료가 이 축을 이만큼 움직인다" 는 갱신분만
#   공유 온톨로지로 환류하며, 그것도 서로 다른 제품 둘 이상이 같은 재료를
#   써본 뒤에야 나간다(사용자 결정 2026-09-10).
# =============================================================================

