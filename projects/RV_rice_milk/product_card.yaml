# =============================================================================
# PRODUCT CARD — RV rice milk
# -----------------------------------------------------------------------------
# 제품당 한 장. 제형(STRUCTURE)의 축 카드(AXIS_CARD) 위에 **벗어나는 것만** 얹는다.
#
# 두 층 (사용자 결정 2026-09-11)
#   AXIS_CARD     제형별 축 카드. layerM_cards_<제형>.yaml. 제품 사이에 공유된다.
#                 앵커·평가 주의·합격선을 한 번만 쓴다.
#   PRODUCT_CARD  이 파일. 제품이 제형 카드에서 벗어나는 것 - 정체성 축, tier 나
#                 goal 을 바꾼 것, 실측 열 매핑, 뺀 축.
#
# 왜 두 층인가 - 재 보니 (2026-09-11)
#   옛 cards.yaml 16장 중 8장이 제형 카드의 복사본이었다. 제품이 실제로 다르게
#   가진 정보는 새 축 셋과 값 몇 줄뿐이다. 제품마다 16장을 복사하면 제품 30개에
#   단맛 앵커가 30벌 생기고 서로 갈라진다. 재료 데이터베이스가 기능군(공통) +
#   재료 override(특정)인 것과 같은 2-tier 다.
#
# 합성 규칙 (v2adapter._load_projects)
#   1 제형의 AXIS_CARD 를 전부 가져온다
#   2 drop 에 있는 축을 뺀다
#   3 axes 의 항목: 제형에 있는 축이면 적힌 필드만 덮고, 없는 축이면 통째로 더한다
#   4 그 뒤 보편 축(기본맛)이 평소처럼 채워진다
#
# 무엇이 여기 남고 무엇이 공유로 가나
#   좌표는 격리하고 기울기는 공유한다. 배합 %, 목표 점수, 샘플 ID, 벤치마크
#   제품명은 여기(projects/)에 남는다. "이 재료가 이 축을 이만큼 움직인다" 는
#   갱신분만 공유 온톨로지로 환류하며, 서로 다른 제품 둘 이상이 같은 재료를
#   써본 뒤에야 나간다(사용자 결정 2026-09-10).
# =============================================================================

meta:
  id: RV_rice_milk
  ko: 쌀 음료
  kind: product
  structure: beverage
  data: data/beverage_warmloop_260720.xlsx
  process_block: RM-P1
  moved_from: ontology_v2/layers/layerM_cards_beverage_rice_milk.yaml
  moved_on: '2026-09-10'
  split_into_two_layers: '2026-09-11'
drop:
- L.ta.sour
- L.ap.cloudy
- L.ta.aftertaste_length
- L.ap.color_intensity
- L.ap.oil_ring
axes:
  L.ta.sweet:
    legacy_column: sens_sweet
    ko:
      evaluation_note: 마시는 온도에서 평가하세요. 차가우면 단맛이 눌리므로(R-2 저온→단맛), 기준보다 차게 마신 시료는 배합 때문이 아닌 이유로 낮게 나옵니다.
  L.tx.body:
    default_goal: increase
    legacy_column: sens_mouthfeel
    ko:
      evaluation_note: 입에 넣었을 때의 묵직함과 꽉 찬 느낌을 봅니다. 크리미함(매끄럽고 지방 같은 질감)과 헷갈리기 쉬우니 바디감을 먼저 판단하세요.
  L.ar.rancid_oxidized:
    tier: core
    default_goal: decrease
    evidence_required: sample
    legacy_column: sens_oxidated oil
    ko:
      evaluation_note: 갓 만든 시료에서 매기는 점수입니다. 훈련되지 않은 평가자는 산패취를 늦게, 들쭉날쭉하게 감지하므로 작은 차이는 잡음으로 보세요. 이 축으로
        결정을 내릴 때는 어느 시료인지 모르게 하고 두 번 이상 맡아 보셔야 합니다.
      pitfalls:
      - 해바라기유는 산화가 잘 됩니다. 기름 종류를 바꾸면 이 축이 넣은 양과 뒤섞입니다.
  L.ar.cooked_rice:
    ko:
      anchors:
        '-3': 밥 향이 기준보다 뚜렷하게 약하다
        '0': 기준과 구분되지 않는다
        '+3': 밥 향이 기준보다 뚜렷하게 강하다
      evaluation_note: 이 제품의 정체성 축이지 결함 축이 아닙니다 — 높일수록 좋은 것이 아니라 맞춰야 할 목표입니다. 코 뒤로 올라오는 향이므로 삼킨 뒤에 판단하고,
        잔 위의 냄새로 판단하지 마세요.
      pitfalls:
      - 단맛이 올라가면 밥 향이 더 강하게 느껴집니다. 두 축은 따로 나눠서 평가하세요.
    active_in:
    - SC.emulsion.ow|APP.beverage
    tier: core
    method: benchmark_difference
    scale_type: diff_7
    benchmark: current_recipe
    default_goal: target
    reliability: medium
    evidence_required: sample
    legacy_column: sens_rice flavor
  L.tx.creaminess:
    ko:
      anchors:
        '-3': 기준보다 뚜렷하게 덜 크리미하다
        '0': 기준과 구분되지 않는다
        '+3': 기준보다 뚜렷하게 더 크리미하다
      evaluation_note: 바디감과 다릅니다 — 바디감은 묵직함이고 크리미함은 매끄럽고 지방 같은 질감입니다. 패널이 둘을 섞어 답하므로 바디감을 먼저, 크리미함을 나중에
        묻는 순서를 지키세요.
      pitfalls:
      - 검(gum)으로 만든 걸쭉함은 바디감으로는 읽히지만 크리미함으로는 읽히지 않습니다. 두 축이 같이 움직이면 패널이 한 질문에 두 번 답하고 있을 가능성이 큽니다.
    active_in:
    - SC.emulsion.ow|APP.beverage
    tier: core
    method: benchmark_difference
    scale_type: diff_7
    benchmark: current_recipe
    default_goal: increase
    reliability: medium
    evidence_required: sample
    legacy_column: sens_creaminess
  L.tx.oiliness:
    ko:
      anchors:
        '-3': 기름진 느낌이 기준보다 뚜렷하게 적다
        '0': 기준과 구분되지 않는다
        '+3': 기름진 느낌이 기준보다 뚜렷하게 많다
      evaluation_note: 산패취(L.ar.rancid_oxidized)와 분리해 둔 '신선한 기름' 쪽 읽기입니다. 이 축의 정의대로 향이 아니라 입천장에 남는 코팅을
        기준으로 매기세요.
      pitfalls:
      - 유화가 깨지면 자유 기름 때문에 기름짐이 높게 나옵니다 — 넣은 양 때문이 아니라 물리적인 이유입니다. 크리밍·분리를 함께 기록해 둬야 둘을 구분할 수 있습니다.
    active_in:
    - SC.emulsion.ow|APP.beverage
    tier: monitored
    method: benchmark_difference
    scale_type: diff_7
    benchmark: current_recipe
    default_goal: decrease
    reliability: medium
    evidence_required: sample
    mapping_status: draft_confirm
    legacy_column: sens_oil flavor
